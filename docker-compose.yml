version: "3.8"
services:
  modresorts:
    image: modresorts:latest
    ports:
      - "8080:8080"
    environment:
      - WEATHER_API_KEY=${WEATHER_API_KEY:?set WEATHER_API_KEY}
      - NAMING_PROVIDER_URL=${NAMING_PROVIDER_URL}
      - NAMING_FACTORY_INITIAL=${NAMING_FACTORY_INITIAL}
      - DATASOURCE_JNDI=${DATASOURCE_JNDI}
    volumes:
      - modresorts-data:/opt/tomcat/logs
volumes:
  modresorts-data:
