# Spring Boot Application Configuration for ModResorts
# Cloud-native configuration for GCP deployment

# Application name
spring.application.name=modresorts

# Server configuration - port from environment variable for cloud compatibility
server.port=${PORT:8080}

# Logging configuration
logging.level.root=INFO
logging.level.com.acme.modres=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Google Cloud Platform Configuration
gcp.project.id=${GCP_PROJECT_ID:default-project}
gcp.bucket.name=${GCS_BUCKET_NAME:modresorts-data}

# Database Configuration (Cloud SQL)
# Connection pooling with HikariCP (default in Spring Boot)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/modresorts}
spring.datasource.username=${DATABASE_USER:modresorts}
spring.datasource.password=${DATABASE_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Configuration for cloud environments
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis Configuration (Memorystore for Redis)
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.timeout=2000ms
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0

# Session Configuration (Redis-backed for distributed sessions)
spring.session.store-type=redis
spring.session.redis.namespace=modresorts:session
spring.session.timeout=30m

# Servlet Configuration
server.servlet.context-path=/
server.servlet.session.timeout=30m

# Actuator endpoints for health checks (required for GKE/Cloud Run)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.redis.enabled=true

# Timezone configuration - always use UTC in cloud environments
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
