# Application configuration
server.port=${PORT:8080}

# Azure Storage configuration
AZURE_STORAGE_ENDPOINT=https://modresortsstorage.blob.core.windows.net

# Azure Key Vault configuration
KEY_VAULT_URL=https://modresorts-kv.vault.azure.net/

# Logging - prevent secret leakage through SDK wire logs
logging.level.com.azure=WARN
logging.level.com.azure.request=WARN
logging.level.org.apache.http.wire=WARN
logging.level.org.apache.http.headers=WARN
logging.level.com.zaxxer.hikari=INFO
