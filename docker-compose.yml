version: '3.8'

services:
  modresorts:
    build:
      context: .
      dockerfile: Dockerfile
    image: modresorts:latest
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - TZ=UTC
      - JAVA_OPTS=-Xmx512m -Xms256m
    volumes:
      - ./src/main/resources:/app/config
    restart: always
