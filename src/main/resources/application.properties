# Spring Boot Application Configuration for AWS Cloud Deployment
# All sensitive values should be externalized to environment variables or AWS Secrets Manager

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# AWS Region Configuration
aws.region=${AWS_REGION:us-east-1}

# S3 Configuration for file storage
s3.bucket.name=${S3_BUCKET_NAME:modresorts-data}

# Database Configuration with HikariCP
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/modresorts}
spring.datasource.username=${DATABASE_USERNAME:modresorts}
spring.datasource.password=${DATABASE_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings (optimized for cloud)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis Configuration for Amazon ElastiCache
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}
spring.redis.timeout=2000ms

# Spring Session Configuration
spring.session.store-type=redis
spring.session.redis.flush-mode=on_save
spring.session.redis.namespace=modresorts:session

# Logging Configuration (structured for cloud monitoring)
logging.level.root=INFO
logging.level.com.acme.modres=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator endpoints for health checks (AWS ECS/EKS)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.redis.enabled=true
management.health.db.enabled=true

# Application Info
spring.application.name=ModResorts
info.app.name=ModResorts
info.app.version=2.0.0
info.app.description=Cloud-ready resort management application
