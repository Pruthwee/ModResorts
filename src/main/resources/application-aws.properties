# AWS-specific configuration profile
# This profile should be activated when deploying to AWS (ECS, EKS, Fargate)

# AWS Region Configuration
aws.region=${AWS_REGION:us-east-1}

# Amazon RDS Configuration
spring.datasource.url=${RDS_JDBC_URL}
spring.datasource.username=${RDS_USERNAME}
spring.datasource.password=${RDS_PASSWORD}

# Amazon ElastiCache Redis Configuration
spring.redis.host=${ELASTICACHE_ENDPOINT}
spring.redis.port=${ELASTICACHE_PORT:6379}
spring.redis.ssl=true

# Amazon S3 Configuration
aws.s3.bucket=${S3_BUCKET_NAME}

# AWS Secrets Manager Configuration
weather.api.secret.name=${WEATHER_API_SECRET_NAME:weather-api-credentials}

# CloudWatch Metrics
management.metrics.export.cloudwatch.enabled=true
management.metrics.export.cloudwatch.namespace=ModResorts
management.metrics.export.cloudwatch.batch-size=20

# Logging for CloudWatch
logging.level.root=INFO
logging.level.com.acme.modres=INFO
