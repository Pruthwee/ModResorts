# Spring Boot Application Configuration
spring.application.name=modresorts

# Server Configuration (externalized via environment variables)
server.port=${SERVER_PORT:8080}

# Database Configuration (HikariCP)
spring.datasource.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/modresorts}
spring.datasource.username=${DB_USERNAME:modresorts}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Redis Configuration for Session Management (Amazon ElastiCache)
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}
spring.redis.timeout=2000ms

# Spring Session Configuration
spring.session.store-type=redis
spring.session.redis.flush-mode=on_save
spring.session.redis.namespace=modresorts:session

# AWS Configuration
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket=${S3_BUCKET_NAME:modresorts-data}

# Logging Configuration
logging.level.root=INFO
logging.level.com.acme.modres=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator Configuration for Cloud Monitoring
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
